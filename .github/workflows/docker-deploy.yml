name: Docker Deploy

# Construye la imagen, levanta el sistema completo con Docker Compose, comprueba
# que responde y, si todo salió bien en develop o main, la publica en DockerHub.
#
# Secretos del repositorio necesarios para publicar:
#   DOCKERHUB_USERNAME   usuario de DockerHub
#   DOCKERHUB_TOKEN      token de acceso (Account Settings > Security)

on:
  push:
    branches: [develop, main, 'feature/docker-deploy']
  pull_request:
    branches: [develop]
  workflow_dispatch:

jobs:
  construir-y-verificar:
    name: Construir imagen y probar el despliegue
    runs-on: ubuntu-latest

    env:
      # Contraseña efímera: la base vive solo mientras dura el job.
      PGPASSWORD: ${{ github.run_id }}
      DOCKERHUB_USER: local
      TAG: ci

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      # El build de Maven ocurre dentro de la etapa "build" del Dockerfile, así
      # que construir la imagen ya incluye compilar y empaquetar el proyecto.
      - name: Construir la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          # Mismo nombre que docker-compose.yml espera: ${DOCKERHUB_USER}/gastroflow:${TAG}
          tags: local/gastroflow:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Levantar el sistema completo con Docker Compose
        run: docker compose up -d --no-build

      - name: Esperar a que la aplicación esté sana
        run: |
          for i in $(seq 1 30); do
            estado=$(docker inspect -f '{{.State.Health.Status}}' \
                     "$(docker compose ps -q app)" 2>/dev/null || echo starting)
            echo "intento $i: $estado"
            [ "$estado" = "healthy" ] && exit 0
            sleep 5
          done
          docker compose logs
          exit 1

      - name: Probar el acceso web y el esquema de la base
        run: |
          curl -fsS http://localhost:6080/vnc.html | grep -qi novnc
          docker compose exec -T db psql -U postgres -d gastroflow -At \
            -c "SELECT count(*) FROM usuarios" | grep -qE '^[1-9]'
          docker compose logs app | grep -iE "exception|error" && exit 1 || true

      - name: Mostrar logs si algo falló
        if: failure()
        run: docker compose logs

      - name: Apagar el sistema
        if: always()
        run: docker compose down -v

  publicar:
    name: Publicar en DockerHub
    needs: construir-y-verificar
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Etiquetas de la imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/gastroflow
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,prefix=

      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
