  # Si el repositorio no usa main sino develop como rama principal, entonces
  # build.yml puede quedar solo con workflow_dispatch y el análisis de develop
  # lo hace ci.yml. Lo importante es que no haya dos workflows analizando el mismo PR.
  name: SonarQube

  on:
    push:
      branches:
        - main
    pull_request:
      types: [opened, synchronize, reopened]

  jobs:
    build:
      name: Build and analyze
      runs-on: ubuntu-latest

      steps:
        - uses: actions/checkout@v4
          with:
            fetch-depth: 0

        - name: Set up JDK 21
          uses: actions/setup-java@v4
          with:
            java-version: 21
            distribution: zulu

        - name: Cache SonarQube packages
          uses: actions/cache@v4
          with:
            path: ~/.sonar/cache
            key: ${{ runner.os }}-sonar
            restore-keys: ${{ runner.os }}-sonar

        - name: Cache Maven packages
          uses: actions/cache@v4
          with:
            path: ~/.m2
            key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
            restore-keys: ${{ runner.os }}-m2

        - name: Build and analyze
          env:
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          run: >
            mvn -B verify
            org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
            -Dsonar.projectKey=puj-course_FIS_2630_1204_G2
            -Dsonar.organization=puj-course
            -Dsonar.host.url=https://sonarcloud.io