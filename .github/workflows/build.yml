  # Si el repositorio no usa main sino develop como rama principal, entonces
  # build.yml puede quedar solo con workflow_dispatch y el análisis de develop
  # lo hace ci.yml. Lo importante es que no haya dos workflows analizando el mismo PR.
name: SonarQube

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonar-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-analyze:
    name: Compilar, probar y analizar en main
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      GASTROFLOW_DB_URL: jdbc:postgresql://localhost:5432/gastroflow
      GASTROFLOW_DB_USER: postgres
      GASTROFLOW_DB_PASSWORD: postgres
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Descargar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java 21 y caché Maven
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Instalar cliente PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Preparar permisos de los scripts
        run: chmod +x scripts/setup.sh scripts/test.sh

      - name: Crear esquema y datos de prueba
        run: ./scripts/setup.sh --recrear --con-datos-prueba

      - name: Compilar, probar y generar cobertura
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Verificar que las pruebas se ejecutaron de verdad
        if: always()
        run: python3 scripts/verificar_pruebas.py

      - name: Analizar la calidad con SonarCloud
        if: ${{ env.SONAR_TOKEN != '' }}
        run: >
          mvn --batch-mode --no-transfer-progress
          org.sonarsource.scanner.maven:sonar-maven-plugin:5.0.0.4389:sonar
          -Dsonar.scanner.skipJreProvisioning=true