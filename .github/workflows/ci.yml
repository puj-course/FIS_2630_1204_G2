  # Este es el flujo real para PR hacia develop, push a develop y push a ramas features-*.
  # Incluye PostgreSQL, instalación desde el snapshot canónico, pruebas, cobertura, control
  # de pruebas ejecutadas y Sonar.

  name: CI

  on:
    push:
      branches:
        - develop
        - 'features-*'
    pull_request:
      branches:
        - develop

  jobs:
    build-and-test:
      name: Compilar y ejecutar pruebas
      runs-on: ubuntu-latest

      services:
        postgres:
          image: postgres:16
          env:
            POSTGRES_DB: postgres
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
          ports:
            - 5432:5432
          options: >-
            --health-cmd "pg_isready -U postgres -d postgres"
            --health-interval 10s
            --health-timeout 5s
            --health-retries 5

      env:
        PGHOST: localhost
        PGPORT: 5432
        PGUSER: postgres
        PGPASSWORD: postgres
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      steps:
        - name: Descargar código
          uses: actions/checkout@v4
          with:
            fetch-depth: 0

        - name: Configurar Java 21 y caché Maven
          uses: actions/setup-java@v4
          with:
            java-version: '21'
            distribution: temurin
            cache: maven

        - name: Instalar cliente PostgreSQL
          run: |
            sudo apt-get update
            sudo apt-get install -y postgresql-client

        - name: Preparar permisos del script
          run: chmod +x scripts/setup.sh

        - name: Crear esquema y datos de prueba
          run: ./scripts/setup.sh --con-datos-prueba

        - name: Compilar el proyecto
          run: mvn --batch-mode clean compile

        - name: Ejecutar pruebas automatizadas
          run: mvn --batch-mode test

        - name: Generar el informe HTML de resultados
          if: always()
          run: mvn --batch-mode surefire-report:report-only

        - name: Publicar el informe de pruebas y la cobertura
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: informe-de-pruebas
            retention-days: 30
            path: |
              target/site/surefire-report.html
              target/site/jacoco/
              target/surefire-reports/

        - name: Analizar la calidad con SonarCloud
          if: ${{ env.SONAR_TOKEN != '' }}
          run: >
            mvn --batch-mode
            org.sonarsource.scanner.maven:sonar-maven-plugin:5.0.0.4389:sonar

    notificar:
      name: Avisar por Telegram
      runs-on: ubuntu-latest
      needs: build-and-test
      if: always() && ((github.event_name == 'push' && github.ref == 'refs/heads/develop') || github.event_name == 'pull_request')
      steps:
        - name: Enviar resultado a Telegram
          env:
            TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
            CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
            RESULTADO: ${{ needs.build-and-test.result }}
            REPO: ${{ github.repository }}
            URL_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          run: |
            if [ "$RESULTADO" = "success" ]; then
              ESTADO="✅ Pruebas OK"
            else
              ESTADO="❌ Pruebas FALLARON"
            }
            
            TEXTO="${ESTADO} | Repo: ${REPO} | Ejecución: ${URL_RUN}"
            
            curl -sS -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${CHAT_ID}" \
              --data-urlencode "text=${TEXTO}"