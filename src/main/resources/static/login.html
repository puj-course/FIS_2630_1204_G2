<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GastroFlow - Inicio de sesión</title>
    <style>
        body{font-family:Arial,sans-serif;background:#f4f4f4;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}
        .card{background:white;padding:32px;border-radius:12px;width:340px;box-shadow:0 4px 18px #0002}
        h1{margin-top:0;text-align:center}.field{margin:14px 0}label{display:block;margin-bottom:6px;font-weight:bold}
        input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccc;border-radius:6px}
        button{width:100%;padding:11px;margin-top:8px;border:0;border-radius:6px;background:#333;color:white;cursor:pointer}
        #mensaje{margin-top:14px;text-align:center}.ok{color:green}.error{color:#b00020}
    </style>
</head>
<body>
<div class="card">
    <h1>GastroFlow</h1>
    <p style="text-align:center">Inicio de sesión - Cajero</p>
    <form id="loginForm">
        <div class="field"><label for="codigo">Código de empleado</label><input id="codigo" required></div>
        <div class="field"><label for="password">Contraseña</label><input id="password" type="password" required></div>
        <button type="submit">Iniciar sesión</button>
    </form>
    <div id="mensaje"></div>
</div>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const mensaje = document.getElementById('mensaje');
    mensaje.className = '';
    try {
        const r = await fetch('/api/auth/login', {
            method:'POST', headers:{'Content-Type':'application/json'},
            body:JSON.stringify({codigo:document.getElementById('codigo').value, password:document.getElementById('password').value})
        });
        const data = await r.json();
        mensaje.textContent = data.mensaje || 'Error';
        mensaje.className = r.ok ? 'ok' : 'error';
        if (r.ok) mensaje.textContent += ' — Bienvenido/a ' + data.nombre;
    } catch (err) {
        mensaje.textContent = 'No se pudo conectar con el servidor.';
        mensaje.className = 'error';
    }
});
</script>
</body>
</html>
